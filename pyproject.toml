[project]
name = "djangocon"
version = "0.1.0"
description = "DjangoCon Europe 2027 website"
readme = "README.md"
license = { text = "MIT" }
requires-python = "==3.13.*"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.13",
]

# ==== djLint ====
[tool.djlint]
profile = "django"
include = "H017,H035"
indent = 2
max_line_length = 119
blank_line_after_tag = "load,extends"
close_void_tags = true
format_css = true
format_js = true
ignore = "H006,H030,H031"
css.indent_size = 2
js.indent_size = 2

# ==== ruff ====
[tool.ruff]
target-version = "py313"
line-length = 119
extend-exclude = [
  "node_modules",
  "staticfiles",
]
lint.select = [
  "A",
  "B",
  "BLE",
  "C4",
  "C90",
  "COM",
  "DJ",
  "DTZ",
  "E",
  "EM",
  "ERA",
  "F",
  "FBT",
  "G",
  "I",
  "ISC",
  "N",
  "PERF",
  "PGH",
  "PIE",
  "PL",
  "PT",
  "PTH",
  "Q",
  "RET",
  "RSE",
  "RUF",
  "S",
  "SIM",
  "T10",
  "T20",
  "TC",
  "TID",
  "TRY",
  "UP",
  "W",
]
lint.ignore = [
  "COM812", # trailing commas are handled by the formatter
  "ISC001", # conflicts with the formatter
  "RUF012", # Mutable class attributes should be annotated with `typing.ClassVar`
  "S101",   # Use of assert detected
  "SIM102", # sometimes it's better to nest
]
lint.isort.force-single-line = true
lint.isort.known-first-party = [ "djangocon", "config" ]

[tool.ruff.lint.per-file-ignores]
"config/settings/*.py" = [ "F403", "F405" ]  # star imports are the settings-module pattern
"setup_env.py" = [ "T201" ]  # prints are the point

[tool.pytest]
ini_options.norecursedirs = [ "node_modules" ]
ini_options.python_files = [
  "test_*.py",
  "tests.py",
]
# ==== pytest ====
ini_options.addopts = [
  "--ds=config.settings.local",
  "--import-mode=importlib",
]
