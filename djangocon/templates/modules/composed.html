{% load markdown_extras %}

{% with title=content|meta:"title" %}
  <div class="container composed-page" id="pages">
    <div class="row {{ title|slugify }}-row">
      <div class="col-10 col-lg-3">
        <h2 class="section-title">{{ content|meta:"section" }}</h2>
      </div>
      <div class="{{ title|slugify }}-content simple-content col-12 col-lg-9">{{ content.html|safe }}</div>
    </div>
  </div>
{% endwith %}
