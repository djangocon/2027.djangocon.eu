{% comment %}
Important dates. Rows come from content/home/dates.md; `.date-row` is styled in
_homepage.scss into the two-column month / entries layout.
{% endcomment %}
<section class="home-dates section-shell">
  <h2 class="section-heading section-heading--alt">
    {{ content.meta.heading.0|default:"Important dates" }}
  </h2>
  <div class="dates-list">
    {{ content.html|safe }}
  </div>
</section>
