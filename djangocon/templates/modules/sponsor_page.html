{% load markdown_extras %}
{% load static %}

<div class="container" id="pages">
  {% include "modules/page_title.html" with title=content|meta:"title" %}
  <div class="simple-content">{{ content.html|safe }}</div>
  <div class="sponsors-grid p-0 pt-4">
    {% for category, sponsors_list in sponsors.items %}
      <p class="sponsors-categories">{{ category }}</p>
      <div class="sponsor-row">
        {% for sponsor in sponsors_list %}
          <a href="{{ sponsor.url }}"
             target="_blank"
             rel="noopener"
             class="sponsor-logo">
            <img src="{% static sponsor.logo %}"
                 alt="{{ sponsor.name }}"
                 {% if sponsor.filter %}style="filter: brightness(0) invert(1)"{% endif %} />
          </a>
        {% endfor %}
      </div>
    {% endfor %}
  </div>
</div>
