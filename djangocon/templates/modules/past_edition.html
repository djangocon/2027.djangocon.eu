{% comment %}
Past editions strip. Cards come from content/home/past_edition.md; `.edition` is
styled in _homepage.scss.
{% endcomment %}
<section class="past-editions section-shell">
  <h2 class="section-heading">
    {{ content.meta.heading.0|default:"Take a look at past editions" }}
  </h2>
  <div class="editions-row">
    {{ content.html|safe }}
  </div>
</section>
