{% load static %}

  <div class="editions-grid">

       href="https://2023.djangocon.eu/"

       href="https://2024.djangocon.eu/"

       rel="noopener">
      <img src="{% static 'images/past/2024_vigo.png' %}"
           alt="DjangoCon Europe 2024 Vigo group photo at the harbour" />
    </a>
    <a class="grid-item"
       href="https://2025.djangocon.eu/"
       target="_blank"
       rel="noopener">
      <img src="{% static 'images/past/2025_dublin.png' %}"
           alt="DjangoCon Europe 2025 Dublin audience" />
    </a>
    <a class="grid-item"
       href="https://2026.djangocon.eu/"
       target="_blank"
       rel="noopener">
      <img src="{% static 'images/past/2026_athens.png' %}"
           alt="DjangoCon Europe 2026 Athens group photo in the conference hall" />
