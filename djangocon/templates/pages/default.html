{% extends "base.html" %}

{% load markdown_extras %}
{% load static %}

{% block content %}
  {% for file in files.values %}
    {% with content=file|markdown %}
      <div class="container-fluid content-container {% cycle 'odd-pages' 'even-pages' %}">
        {% include "modules/default.html" %}
      </div>
    {% endwith %}
  {% endfor %}
{% endblock content %}
